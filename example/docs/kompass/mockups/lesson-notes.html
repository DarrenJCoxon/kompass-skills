<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Where notes sit on the lesson screen</title>
<meta name="kompass:decision" content="D-001">
<meta name="kompass:status" content="approved">
<meta name="kompass:chosen" content="B, side panel tab">
<meta name="kompass:summary" content="Notes below the video, or as a tab beside course contents. Try typing, switch states, and view at phone width.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../assets/kompass-tokens.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-sans); background: var(--white); color: var(--ink); font-size: 16px; line-height: 1.65; }
  .kbar { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 10px 16px; background: var(--mist); border-bottom: 1px solid var(--line); font-size: 12px; }
  .kbar b { font-weight: 600; }
  .kbar [role=group] { display: flex; gap: 4px; flex-wrap: wrap; }
  .kbar button { min-height: 32px; border: 0; border-radius: var(--radius-pill); padding: 4px 12px; background: var(--white); font: inherit; font-weight: 500; cursor: pointer; }
  .kbar button[aria-pressed=true] { background: var(--ink); color: var(--white); }
  .sample { color: var(--muted); }

  .stage { padding: 20px; transition: max-width .2s; margin-inline: auto; }
  body[data-width=phone] .stage { max-width: 390px; border-inline: 1px solid var(--line); min-height: 100vh; padding: 14px; }
  .crumb { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) var(--syllabus); gap: 22px; align-items: start; }
  body[data-width=phone] .layout { grid-template-columns: 1fr; }
  .video { aspect-ratio: 16 / 9; background: var(--ink); color: var(--white); border-radius: var(--radius-12); padding: 22px; display: flex; flex-direction: column; justify-content: space-between; }
  .video small { font-size: 11px; color: var(--video-caption); }
  .video h1 { margin: 0; font-size: clamp(1.4rem, 3vw, 2.2rem); font-weight: 500; letter-spacing: -.03em; line-height: 1.15; }
  .play { width: var(--play); height: var(--play); border-radius: 50%; background: var(--coral); display: grid; place-items: center; color: var(--ink); font-size: 14px; }
  .vrow { display: flex; align-items: center; gap: 12px; font-size: 12px; }
  h2 { font-size: 20px; font-weight: 500; margin: 22px 0 6px; letter-spacing: -.015em; }
  .panel { background: var(--mist); border-radius: var(--radius-12); padding: 18px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 14px; }
  .tabs button { min-height: var(--target); border: 0; border-radius: var(--radius-pill); padding: 6px 14px; background: var(--white); font: inherit; font-size: 12px; font-weight: 500; cursor: pointer; }
  .tabs button[aria-selected=true] { background: var(--ink); color: var(--white); }
  .lessons { list-style: none; margin: 0; padding: 0; font-size: 12px; display: grid; gap: 4px; }
  .lessons li { padding: 10px; border-radius: var(--radius-8); }
  .lessons li[aria-current=true] { background: var(--coral-soft); font-weight: 500; }
  label { display: flex; justify-content: space-between; font-weight: 500; font-size: 14px; }
  label span { font-weight: 400; font-size: 12px; color: var(--muted); }
  textarea { width: 100%; min-height: 150px; margin: 10px 0 6px; padding: 12px; border: 1px solid var(--line); border-radius: var(--radius-10); font: inherit; font-size: 16px; line-height: 1.7; resize: vertical; background: var(--white); }
  .savestate { font-size: 12px; color: var(--muted); min-height: 20px; }
  .error { background: var(--coral-soft); border-radius: var(--radius-8); padding: 10px 12px; font-size: 13px; margin-top: 6px; }
  .empty { font-size: 13px; color: var(--muted); }
  [hidden] { display: none !important; }
  .phone-sheet { border-top: 1px solid var(--line); margin-top: 14px; padding-top: 14px; }
</style>
</head>
<body data-variant="b" data-state="saved" data-width="desktop">
<div class="kbar">
  <b>Mockup</b>
  <div role="group" aria-label="Variant" data-switch="variant">
    <button type="button" data-value="a" aria-pressed="false">A: below the video</button>
    <button type="button" data-value="b" aria-pressed="true">B: side panel tab (approved)</button>
  </div>
  <div role="group" aria-label="State" data-switch="state">
    <button type="button" data-value="empty" aria-pressed="false">No note yet</button>
    <button type="button" data-value="saving" aria-pressed="false">Saving</button>
    <button type="button" data-value="saved" aria-pressed="true">Saved</button>
    <button type="button" data-value="error" aria-pressed="false">Could not save</button>
  </div>
  <div role="group" aria-label="Width" data-switch="width">
    <button type="button" data-value="desktop" aria-pressed="true">Desktop</button>
    <button type="button" data-value="phone" aria-pressed="false">Phone</button>
  </div>
  <span class="sample">Sample course and notes</span>
</div>

<div class="stage">
  <p class="crumb">My learning › AI Essentials for Educators › Module 2</p>
  <div class="layout">
    <div>
      <div class="video">
        <div class="vrow"><small>kompass learning</small><small style="margin-left:auto">12 min</small></div>
        <h1>Planning a unit of work with AI</h1>
        <div class="vrow"><span class="play" aria-hidden="true">▶</span><span>Play lesson</span></div>
      </div>
      <div id="below" data-variant-only="a"><h2>Your notes</h2><div data-notes></div></div>
      <div class="phone-sheet" data-variant-only="b" data-width-only="phone">
        <div data-panel></div>
      </div>
    </div>
    <aside data-width-only="desktop"><div data-panel></div></aside>
  </div>
</div>

<template id="panel">
  <div class="panel">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="contents" aria-selected="false">Contents</button>
      <button type="button" role="tab" data-tab="notes" aria-selected="true" data-variant-only="b">Notes</button>
    </div>
    <div data-tabpanel="contents" hidden>
      <ul class="lessons">
        <li>1. Choosing your settings</li>
        <li aria-current="true">2. Planning a unit of work with AI</li>
        <li>3. Checking task output</li>
      </ul>
    </div>
    <div data-tabpanel="notes" data-variant-only="b"><div data-notes></div></div>
  </div>
</template>

<template id="notes">
  <label for="note">Notes for this lesson <span>Only you can see these</span></label>
  <p class="empty" data-state-only="empty">Write anything you want to remember. Notes save as you type.</p>
  <textarea id="note" placeholder="Type a note…">Try the unit-planning prompt with Year 9 science.
Check the rubric suggestions against our own marking criteria before sharing.</textarea>
  <div class="savestate" data-state-only="saving">Saving…</div>
  <div class="savestate" data-state-only="saved">Saved just now</div>
  <div class="error" data-state-only="error">Could not save. Your note is kept on this device and we will try again in a moment.</div>
</template>

<script>
  const body = document.body;
  document.querySelectorAll('[data-panel]').forEach((el) => el.append(document.getElementById('panel').content.cloneNode(true)));
  document.querySelectorAll('[data-notes]').forEach((el, i) => {
    const frag = document.getElementById('notes').content.cloneNode(true);
    frag.querySelector('textarea').id = 'note' + i; frag.querySelector('label').htmlFor = 'note' + i;
    el.append(frag);
  });
  const show = () => {
    const { variant, state, width } = body.dataset;
    const match = (el, key, value) => el.dataset[key].split(' ').includes(value);
    document.querySelectorAll('[data-variant-only],[data-state-only],[data-width-only]').forEach((el) => {
      const ok = (!el.dataset.variantOnly || match(el, 'variantOnly', variant))
        && (!el.dataset.stateOnly || match(el, 'stateOnly', state))
        && (!el.dataset.widthOnly || match(el, 'widthOnly', width));
      el.hidden = !ok;
    });
    document.querySelectorAll('textarea').forEach((t) => { if (state === 'empty') t.value = ''; });
    document.querySelectorAll('[data-switch=state] button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.value === state)));
    // In variant A the panel only holds contents.
    document.querySelectorAll('[data-tabpanel]').forEach((p) => {
      const tabs = p.closest('.panel').querySelectorAll('[data-tab]');
      const selected = variant === 'a' ? 'contents' : [...tabs].find((t) => t.getAttribute('aria-selected') === 'true')?.dataset.tab ?? 'notes';
      if (variant === 'a') tabs.forEach((t) => t.setAttribute('aria-selected', String(t.dataset.tab === 'contents')));
      p.hidden = p.dataset.tabpanel !== selected || (p.dataset.variantOnly && !match(p, 'variantOnly', variant));
    });
  };
  document.querySelectorAll('[data-switch]').forEach((group) => group.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    group.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    body.dataset[group.dataset.switch] = b.dataset.value; show();
  }));
  document.addEventListener('click', (e) => {
    const tab = e.target.closest('[data-tab]'); if (!tab) return;
    tab.parentElement.querySelectorAll('[data-tab]').forEach((t) => t.setAttribute('aria-selected', String(t === tab)));
    show();
  });
  let timer;
  document.addEventListener('input', (e) => {
    if (e.target.tagName !== 'TEXTAREA') return;
    if (body.dataset.state === 'error') return;
    body.dataset.state = 'saving'; show();
    clearTimeout(timer); timer = setTimeout(() => { body.dataset.state = 'saved'; show(); }, 1000);
  });
  show();
</script>
</body>
</html>
