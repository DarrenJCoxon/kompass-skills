# LiteBench CI box: one private Docker engine (dind) shared by one runner per repository.
# Jobs never reach the host's Docker. Runners share dind's network namespace, so service
# containers a job publishes are reachable on localhost, as on GitHub's runners.
#
#   docker compose -p lb-base --profile base up -d        # the shared engine (once)
#   ./register.sh OWNER/REPO < token                       # a runner per repo
name: ${COMPOSE_PROJECT_NAME:-lb-base}

services:
  dind:
    profiles: [base]
    container_name: lb-dind
    image: docker:29-dind
    privileged: true
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: ""
    command: ["--tls=false"]
    volumes:
      - lb-work:/work
      - lb-docker-data:/var/lib/docker

  runner:
    profiles: [runner]
    build: .
    image: litebench-runner:local
    restart: unless-stopped
    network_mode: container:lb-dind
    environment:
      DOCKER_HOST: tcp://127.0.0.1:2375
      RUNNER_REPO: ${RUNNER_REPO:-}
      RUNNER_SLUG: ${RUNNER_SLUG:-}
      RUNNER_NAME: ${RUNNER_NAME:-}
      RUNNER_LABELS: ${RUNNER_LABELS:-}
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      # One package cache shared by every runner (jobs run one at a time), on the work
      # volume so pnpm can hard-link from it and it survives runs and rebuilds.
      npm_config_cache: /work/.cache/npm
      npm_config_store_dir: /work/.cache/pnpm-store
      COREPACK_HOME: /work/.cache/corepack
      YARN_CACHE_FOLDER: /work/.cache/yarn
      TURBO_CACHE_DIR: /work/.cache/turbo
      LITEBENCH_TOOL_CACHE: /work/.cache/tools
    volumes:
      - lb-work:/work
      - lb-locks:/locks
      - state:/home/runner/state

volumes:
  lb-work:
    name: lb-work
  lb-docker-data:
    name: lb-docker-data
  lb-locks:
    name: lb-locks
  state:
