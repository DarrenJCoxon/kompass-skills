# Kompass runner. Build once, then start a sequence for a repository with start.sh (see README.md):
#
#   docker compose build
#   ./start.sh <owner/repo> --hours 8      # runs as container kompass-<repo>, with notifications
#   docker logs -f kompass-<repo>          # follow progress
#   docker stop kompass-<repo>             # stop at once (the unit in progress keeps its branch)
#
# Secrets live in runner/.env on the server only (see .env.example); never commit them.
name: kompass

services:
  runner:
    build:
      context: ..
      dockerfile: runner/Dockerfile
    image: kompass-runner:local
    env_file: .env
    environment:
      # A unit session that ends its turn while a builder is still working waits for it, up to 2 hours.
      # Claude Code's default stops background helpers after 10 minutes, which cut WU-0119's builder off mid-job.
      CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS: "7200000"
      # Helpers keep Claude Code's 5-minute prompt cache. A 1-hour cache for them (CLAUDE_CODE_SUBAGENT_PROMPT_CACHE_TTL=1h)
      # was priced on tertia's 26-29 Oct helpers: its dearer writes cost about what it saved. Helpers wait in steps of
      # at most 4 minutes instead (agents/*.md), so their cache doesn't lapse during test runs.
      # Headless runner: skip regenerating plan.html on every sync, and prune idle worktree caches older than 24 h.
      KOMPASS_HEADLESS: "1"
      KOMPASS_PRUNE_IDLE_HOURS: "24"
      # Shared package caches on /work so worktrees hard-link from one store and survive container rebuilds.
      npm_config_cache: /work/.cache/npm
      npm_config_store_dir: /work/.cache/pnpm-store
      # Never block on interactive pnpm TTY prompts (e.g. node_modules purge confirmation) under pts/0.
      npm_config_confirm_modules_purging: "false"
      COREPACK_HOME: /work/.cache/corepack
      YARN_CACHE_FOLDER: /work/.cache/yarn
      TURBO_CACHE_DIR: /work/.cache/turbo
      NODE_OPTIONS: "--max-old-space-size=2048"
    restart: "no"
    # CI comes first (runner/compose.test.sh): the runner may use every free CPU, but when CI's jobs (weight 1024) want the
    # CPUs too they get four times its share, so a Pictures job's dev server is not starved by the runner's own test suites.
    cpu_shares: 256
    mem_limit: ${RUNNER_MEM_LIMIT:-8g}
    init: true
    pids_limit: 1024
    volumes:
      - work:/work
      - claude-state:/home/kompass/.claude/projects
      # Antigravity CLI (agy) Google AI Ultra subscription auth/settings (bind-mount host ~/.gemini/antigravity-cli via AGY_AUTH_DIR, or named volume).
      - ${AGY_AUTH_DIR:-agy-state}:/home/kompass/.gemini/antigravity-cli
      # Playwright's browser, installed once by the first session that needs it and kept across restarts.
      - browsers:/home/kompass/.cache/ms-playwright

volumes:
  work:
    name: kompass-work
  claude-state:
    name: kompass-claude-state
  agy-state:
    name: kompass-agy-state
  browsers:
    name: kompass-browsers
