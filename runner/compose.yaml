# Kompass runner. Build once, then start a sequence for a repository with start.sh (see README.md):
#
#   docker compose build
#   ./start.sh <owner/repo> --hours 8      # runs as container kompass-<repo>, with notifications
#   docker logs -f kompass-<repo>          # follow progress
#   docker stop kompass-<repo>             # stop at once (the unit in progress keeps its branch)
#
# Secrets live in runner/.env on the server only (see .env.example); never commit them.
name: kompass

services:
  runner:
    build:
      context: ..
      dockerfile: runner/Dockerfile
    image: kompass-runner:local
    env_file: .env
    environment:
      # A unit session that ends its turn while a builder is still working waits for it, up to 2 hours.
      # Claude Code's default stops background helpers after 10 minutes, which cut WU-0119's builder off mid-job.
      CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS: "7200000"
      # Helpers keep Claude Code's 5-minute prompt cache. A 1-hour cache for them (CLAUDE_CODE_SUBAGENT_PROMPT_CACHE_TTL=1h)
      # was priced on tertia's 26-29 Oct helpers: its dearer writes cost about what it saved. Helpers wait in steps of
      # at most 4 minutes instead (agents/*.md), so their cache doesn't lapse during test runs.
    restart: "no"
    volumes:
      - work:/work
      - claude-state:/home/kompass/.claude/projects
      # Playwright's browser, installed once by the first session that needs it and kept across restarts.
      - browsers:/home/kompass/.cache/ms-playwright

volumes:
  work:
    name: kompass-work
  claude-state:
    name: kompass-claude-state
  browsers:
    name: kompass-browsers
